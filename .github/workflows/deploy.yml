name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import ftplib, os, sys
          from pathlib import Path

          server   = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          local    = Path("./out")
          remote   = "/public_html"

          def ensure_dir(ftp, path):
              try: ftp.mkd(path)
              except: pass

          def upload(ftp, local_path, remote_path):
              ensure_dir(ftp, remote_path)
              for item in sorted(local_path.iterdir()):
                  rp = f"{remote_path}/{item.name}"
                  if item.is_dir():
                      upload(ftp, item, rp)
                  else:
                      with open(item, "rb") as f:
                          ftp.storbinary(f"STOR {rp}", f)
                      print(f"  uploaded: {rp}")

          try:
              ftp = ftplib.FTP()
              ftp.connect(server, 21, timeout=60)
              ftp.login(username, password)
              ftp.set_pasv(True)
              print(f"Connected to {server}")
              upload(ftp, local, remote)
              ftp.quit()
              print("Deploy complete.")
          except Exception as e:
              print(f"FTP error: {e}", file=sys.stderr)
              sys.exit(1)
          EOF
